<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --white:#fff;--gray50:#f8f9fa;--gray100:#f1f3f5;--gray200:#e9ecef;
  --gray300:#dee2e6;--gray400:#ced4da;--gray500:#adb5bd;--gray600:#868e96;
  --gray700:#495057;--gray800:#343a40;--gray900:#212529;
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1d4ed8;
  --green:#16a34a;--green-light:#f0fdf4;--orange:#ea580c;--orange-light:#fff7ed;
  --red:#dc2626;--red-light:#fef2f2;--purple:#7c3aed;--teal:#0d9488;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray100);color:var(--gray800);font-size:13px;padding:16px;}
.card{background:#fff;border-radius:8px;border:1px solid var(--gray200);padding:16px;margin-bottom:12px;}
.card-title{font-size:13px;font-weight:700;color:var(--gray800);margin-bottom:12px;}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.tab-bar{display:flex;border-bottom:2px solid var(--gray200);margin-bottom:16px;}
.tab-btn{padding:8px 16px;font-size:12px;font-weight:600;color:var(--gray500);cursor:pointer;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;background:none;font-family:'Noto Sans KR',sans-serif;transition:all .12s;}
.tab-btn:hover{color:var(--primary);}
.tab-btn.on{color:var(--primary);border-bottom-color:var(--primary);}
.tab-content{display:none;}.tab-content.on{display:block;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .12s;}
.btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}.btn-outline:hover{background:var(--primary);color:#fff;}
.btn-gray{background:var(--gray100);color:var(--gray700);border:1px solid var(--gray300);}.btn-gray:hover{background:var(--gray200);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{background:#15803d;}
.btn-danger{background:var(--red);color:#fff;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-sm{padding:5px 10px;font-size:11px;}.btn-xs{padding:3px 8px;font-size:10px;}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.row-gap{display:flex;gap:8px;align-items:center;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.fg label{font-size:11px;font-weight:600;color:var(--gray600);}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--gray300);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .12s;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary);}
.fg input[readonly]{background:var(--gray50);color:var(--gray600);}
.fg textarea{min-height:60px;resize:vertical;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--gray50);border-bottom:1px solid var(--gray200);padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--gray500);white-space:nowrap;}
tbody td{border-bottom:1px solid var(--gray100);padding:8px 10px;color:var(--gray700);}
tbody tr:hover td{background:var(--gray50);}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.bg{background:#dcfce7;color:#166534;}.bb{background:#dbeafe;color:#1e40af;}
.bo{background:#fed7aa;color:#9a3412;}.br{background:#fee2e2;color:#991b1b;}
.bgr{background:var(--gray100);color:var(--gray600);}.bp{background:#ede9fe;color:#5b21b6;}
.hint{background:var(--gray50);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--gray600);margin-bottom:10px;border-left:3px solid var(--primary);}
.section-title{font-size:12px;font-weight:700;color:var(--gray700);margin:12px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--gray200);}
.search-bar{display:flex;gap:8px;align-items:center;}
.search-bar input,.search-bar select{border:1.5px solid var(--gray300);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.tbl-inp{border:none!important;outline:none;width:100%;padding:5px 6px;font-size:12px;font-family:'Noto Sans KR',sans-serif;background:transparent;}
.tbl-inp:focus{background:var(--primary-light);}
.tbl-cell{border:1px solid var(--gray200);padding:2px;}
.tbl-ro{border:1px solid var(--gray200);padding:6px;text-align:right;background:var(--gray50);font-weight:600;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--gray300);border-radius:4px;}
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn on" onclick="switchTab(this,'q-list')">📋 목록</button>
  <button class="tab-btn" onclick="switchTab(this,'q-general');initGeneral()">📝 일반견적서</button>
  <button class="tab-btn" onclick="switchTab(this,'q-detail');initDetail()">📐 세부내역견적서</button>
</div>

<!-- 목록 -->
<div class="tab-content on" id="q-list">
  <div class="row-between">
    <div class="search-bar">
      <input type="text" id="q-search" placeholder="견적번호, 거래처 검색..." oninput="renderList()">
      <select id="q-status-f" onchange="renderList()">
        <option value="">전체</option><option>발송</option><option>검토중</option><option>수주</option><option>미수주</option>
      </select>
    </div>
    <div class="row-gap">
      <button class="btn btn-outline btn-sm" onclick="switchTab(document.querySelectorAll('.tab-btn')[1],'q-general');initGeneral()">+ 일반견적서</button>
      <button class="btn btn-primary btn-sm" onclick="switchTab(document.querySelectorAll('.tab-btn')[2],'q-detail');initDetail()">+ 세부내역견적서</button>
    </div>
  </div>
  <div class="card">
    <table><thead><tr>
      <th>견적번호</th><th>종류</th><th>작성일</th><th>거래처</th><th>건명</th>
      <th>공급가액</th><th>VAT</th><th>합계</th><th>담당자</th><th>상태</th><th>관리</th>
    </tr></thead>
    <tbody id="q-list-body"></tbody></table>
  </div>
</div>

<!-- 일반견적서 -->
<div class="tab-content" id="q-general">
  <div class="card">
    <div class="card-title-row">
      <div style="font-size:14px;font-weight:700;">📋 일반견적서</div>
      <div class="row-gap">
        <select id="g-status" style="border:1.5px solid var(--gray300);border-radius:6px;padding:6px 10px;font-size:12px;">
          <option>발송</option><option>검토중</option><option>수주</option><option>미수주</option>
        </select>
        <button class="btn btn-gray btn-sm" onclick="initGeneral()">🔄 초기화</button>
        <button class="btn btn-orange btn-sm" onclick="gmailQuote('general')">✉️ Gmail발송</button>
        <button class="btn btn-green btn-sm" onclick="excelQuote('general')">📥 엑셀저장</button>
        <button class="btn btn-outline btn-sm" onclick="printQuote('general')">🖨️ 인쇄/PDF</button>
        <button class="btn btn-primary btn-sm" onclick="saveQuote('general')">💾 저장</button>
      </div>
    </div>
    <div class="fr4">
      <div class="fg"><label>견적번호</label><input type="text" id="g-no" readonly></div>
      <div class="fg"><label>작성일</label><input type="date" id="g-date"></div>
      <div class="fg"><label>유효기간</label><input type="date" id="g-valid"></div>
      <div class="fg"><label>담당자</label><input type="text" id="g-manager" value="박홍준"></div>
    </div>
    <div class="fr3">
      <div class="fg"><label>수신처 (거래처)</label>
        <input type="text" id="g-client" placeholder="거래처명 입력" list="client-list">
        <datalist id="client-list"></datalist>
      </div>
      <div class="fg"><label>담당자명</label><input type="text" id="g-contact" placeholder="거래처 담당자"></div>
      <div class="fg"><label>건명</label><input type="text" id="g-title" placeholder="공사/납품 건명"></div>
    </div>
    <div class="fr4">
      <div class="fg"><label>팩스</label><input type="text" id="g-fax"></div>
      <div class="fg"><label>연락처</label><input type="text" id="g-tel"></div>
      <div class="fg"><label>이메일</label><input type="text" id="g-email" placeholder="발송할 이메일"></div>
      <div class="fg"><label>주소</label><input type="text" id="g-addr"></div>
    </div>

    <div class="section-title">품목 내역</div>
    <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="background:var(--gray800);">
        <th style="color:#fff;padding:7px;width:36px;">No</th>
        <th style="color:#fff;padding:7px;min-width:220px;">품명/규격</th>
        <th style="color:#fff;padding:7px;width:55px;">단위</th>
        <th style="color:#fff;padding:7px;width:65px;">수량</th>
        <th style="color:#fff;padding:7px;width:110px;">단가</th>
        <th style="color:#fff;padding:7px;width:110px;">공급가액</th>
        <th style="color:#fff;padding:7px;width:90px;">VAT</th>
        <th style="color:#fff;padding:7px;width:110px;">합계</th>
        <th style="color:#fff;padding:7px;width:80px;">비고</th>
        <th style="color:#fff;padding:7px;width:28px;"></th>
      </tr></thead>
      <tbody id="g-items"></tbody>
      <tfoot>
        <tr style="background:var(--gray100);font-weight:700;">
          <td colspan="5" style="padding:8px 10px;text-align:right;border:1px solid var(--gray200);">소 계</td>
          <td id="g-sub" style="padding:8px;text-align:right;border:1px solid var(--gray200);">0</td>
          <td id="g-vat" style="padding:8px;text-align:right;border:1px solid var(--gray200);">0</td>
          <td id="g-total" style="padding:8px;text-align:right;border:1px solid var(--gray200);color:var(--primary);font-size:13px;">0</td>
          <td colspan="2" style="border:1px solid var(--gray200);"></td>
        </tr>
      </tfoot>
    </table>
    </div>
    <div class="row-gap" style="margin-top:8px;">
      <button class="btn btn-gray btn-sm" onclick="addGRow()">+ 행 추가</button>
      <button class="btn btn-gray btn-sm" onclick="addFromStdPrice('g')">📋 표준단가에서 추가</button>
    </div>
    <div class="fr2" style="margin-top:10px;">
      <div class="fg"><label>납품조건</label><input type="text" id="g-delivery" value="계약 후 협의 (통상 4~8주 소요)"></div>
      <div class="fg"><label>결제조건</label><input type="text" id="g-payment" value="계약금 30%, 중도금 40%, 잔금 30%"></div>
    </div>
    <div class="fg"><label>특이사항</label><textarea id="g-memo"></textarea></div>
  </div>
</div>

<!-- 세부내역견적서 -->
<div class="tab-content" id="q-detail">
  <div class="card">
    <div class="card-title-row">
      <div style="font-size:14px;font-weight:700;">📐 세부내역견적서</div>
      <div class="row-gap">
        <select id="d-status" style="border:1.5px solid var(--gray300);border-radius:6px;padding:6px 10px;font-size:12px;">
          <option>발송</option><option>검토중</option><option>수주</option><option>미수주</option>
        </select>
        <button class="btn btn-gray btn-sm" onclick="initDetail()">🔄 초기화</button>
        <button class="btn btn-orange btn-sm" onclick="gmailQuote('detail')">✉️ Gmail발송</button>
        <button class="btn btn-green btn-sm" onclick="excelQuote('detail')">📥 엑셀저장</button>
        <button class="btn btn-outline btn-sm" onclick="printQuote('detail')">🖨️ 인쇄/PDF</button>
        <button class="btn btn-primary btn-sm" onclick="saveQuote('detail')">💾 저장</button>
      </div>
    </div>
    <div class="fr4">
      <div class="fg"><label>견적번호</label><input type="text" id="d-no" readonly></div>
      <div class="fg"><label>작성일</label><input type="date" id="d-date"></div>
      <div class="fg"><label>유효기간</label><input type="date" id="d-valid"></div>
      <div class="fg"><label>담당자</label><input type="text" id="d-manager" value="박홍준"></div>
    </div>
    <div class="fr3">
      <div class="fg"><label>수신처</label>
        <input type="text" id="d-client" placeholder="거래처명" list="client-list">
      </div>
      <div class="fg"><label>담당자명</label><input type="text" id="d-contact"></div>
      <div class="fg"><label>건명</label><input type="text" id="d-title"></div>
    </div>
    <div class="fr4">
      <div class="fg"><label>연락처</label><input type="text" id="d-tel"></div>
      <div class="fg"><label>팩스</label><input type="text" id="d-fax"></div>
      <div class="fg"><label>이메일</label><input type="text" id="d-email"></div>
      <div class="fg"><label>주소</label><input type="text" id="d-addr"></div>
    </div>

    <div class="section-title" style="color:var(--primary);">▶ 재료비 항목</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;">
      <thead><tr style="background:var(--gray700);">
        <th style="color:#fff;padding:7px;width:36px;">No</th>
        <th style="color:#fff;padding:7px;width:80px;">공종</th>
        <th style="color:#fff;padding:7px;">세부항목</th>
        <th style="color:#fff;padding:7px;width:110px;">규격/사양</th>
        <th style="color:#fff;padding:7px;width:55px;">단위</th>
        <th style="color:#fff;padding:7px;width:65px;">수량</th>
        <th style="color:#fff;padding:7px;width:110px;">단가</th>
        <th style="color:#fff;padding:7px;width:110px;">공급가액</th>
        <th style="color:#fff;padding:7px;width:28px;"></th>
      </tr></thead>
      <tbody id="d-mat"></tbody>
      <tfoot><tr style="background:var(--gray600);">
        <td colspan="7" style="padding:7px;text-align:right;color:#fff;font-weight:700;border:1px solid var(--gray500);">소 계 (재료비)</td>
        <td id="d-mat-sub" style="padding:7px;text-align:right;color:#fff;font-weight:700;border:1px solid var(--gray500);">0</td>
        <td style="border:1px solid var(--gray500);"></td>
      </tr></tfoot>
    </table>
    <button class="btn btn-gray btn-sm" onclick="addDRow('mat')" style="margin-bottom:12px;">+ 재료비 행 추가</button>

    <div class="section-title" style="color:var(--orange);">▶ 인건비 / 장비비 항목</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;">
      <thead><tr style="background:var(--gray700);">
        <th style="color:#fff;padding:7px;width:36px;">No</th>
        <th style="color:#fff;padding:7px;width:80px;">공종</th>
        <th style="color:#fff;padding:7px;">세부항목</th>
        <th style="color:#fff;padding:7px;width:110px;">규격/사양</th>
        <th style="color:#fff;padding:7px;width:55px;">단위</th>
        <th style="color:#fff;padding:7px;width:65px;">수량</th>
        <th style="color:#fff;padding:7px;width:110px;">단가</th>
        <th style="color:#fff;padding:7px;width:110px;">공급가액</th>
        <th style="color:#fff;padding:7px;width:28px;"></th>
      </tr></thead>
      <tbody id="d-etc"></tbody>
      <tfoot><tr style="background:var(--gray600);">
        <td colspan="7" style="padding:7px;text-align:right;color:#fff;font-weight:700;border:1px solid var(--gray500);">소 계 (인건비+장비)</td>
        <td id="d-etc-sub" style="padding:7px;text-align:right;color:#fff;font-weight:700;border:1px solid var(--gray500);">0</td>
        <td style="border:1px solid var(--gray500);"></td>
      </tr></tfoot>
    </table>
    <button class="btn btn-gray btn-sm" onclick="addDRow('etc')" style="margin-bottom:12px;">+ 인건비/장비 행 추가</button>

    <div class="card" style="background:var(--gray50);">
      <div class="fr3">
        <div class="fg"><label>일반관리비 요율 (%)</label>
          <input type="number" id="d-mgmt-rate" value="10" min="0" max="100" oninput="calcD()">
        </div>
        <div class="fg"><label>일반관리비</label><input type="text" id="d-mgmt-amt" readonly></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--gray800);padding:10px 16px;border-radius:6px;margin-top:8px;">
        <span style="color:#fff;font-size:12px;">공급가액 합계</span>
        <span id="d-supply" style="color:#fff;font-weight:800;font-size:16px;">₩0</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--gray700);padding:8px 16px;border-radius:6px;margin-top:4px;">
        <span style="color:#fff;font-size:12px;">부가가치세 (10%)</span>
        <span id="d-vat" style="color:#fff;font-weight:700;font-size:14px;">₩0</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--primary);padding:12px 16px;border-radius:6px;margin-top:4px;">
        <span style="color:#fff;font-weight:700;">최 종 합 계</span>
        <span id="d-total" style="color:#fff;font-weight:900;font-size:20px;">₩0</span>
      </div>
    </div>

    <div class="fr2" style="margin-top:10px;">
      <div class="fg"><label>납품조건</label><input type="text" id="d-delivery" value="계약 후 협의 (통상 4~8주 소요)"></div>
      <div class="fg"><label>결제조건</label><input type="text" id="d-payment" value="계약금 30%, 중도금 40%, 잔금 30%"></div>
    </div>
    <div class="fg"><label>특이사항</label><textarea id="d-memo"></textarea></div>
  </div>

function nf(n){return Math.round(n||0).toLocaleString();}
function nv(s){return parseFloat((s+'').replace(/[^0-9.-]/g,''))||0;}
function td(){return new Date().toISOString().split('T')[0];}
function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function sv(id,val){var e=document.getElementById(id);if(e)e.value=val||'';}
function st(id,val){var e=document.getElementById(id);if(e)e.textContent=val||'';}
function switchTab(btn,cid){
  var bar=btn.closest('.tab-bar');
  bar.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('on');});
  var el=document.getElementById(cid);if(el)el.classList.add('on');
}
// 공유 데이터 (localStorage)
function getData(key){
  try{var d=localStorage.getItem('erp_'+key);return d?JSON.parse(d):null;}catch(e){return null;}
}
function setData(key,val){
  try{localStorage.setItem('erp_'+key,JSON.stringify(val));return true;}catch(e){return false;}
}
// Gmail 발송 (mailto 방식)
function sendGmail(to,subject,body){
  var mailto='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  window.open(mailto);
}
// 인쇄
function openPrint(html){
  var w=window.open('','_blank','width=1000,height=760');
  w.document.write(html);w.document.close();
}

  sv('g-no', q?q.no:nextNo('general'));
  sv('g-date', q?q.date:td());
  var vd=new Date(); vd.setDate(vd.getDate()+30);
  sv('g-valid', q?q.valid:vd.toISOString().split('T')[0]);
  sv('g-manager', q?q.manager:'박홍준');
  sv('g-client', q?q.client:'');
  sv('g-contact', q?q.contact:'');
  sv('g-title', q?q.title:'');
  sv('g-fax', q?q.fax||'':'');
  sv('g-tel', q?q.tel||'':'');
  sv('g-email', q?q.email||'':'');
  sv('g-addr', q?q.addr||'':'');
  sv('g-delivery', q?q.delivery:'계약 후 협의 (통상 4~8주 소요)');
  sv('g-payment', q?q.payment:'계약금 30%, 중도금 40%, 잔금 30%');
  sv('g-memo', q?q.memo||'':'');
  document.getElementById('g-status').value = q?q.status:'발송';
  // 품목 행
  var b=document.getElementById('g-items'); b.innerHTML='';
  var items = q?q.items:[{name:'',unit:'식',qty:1,price:0,note:''}];
  items.forEach(function(item){addGRow(item);});
  calcG();
}

function addGRow(item){
  item=item||{};
  var b=document.getElementById('g-items'); if(!b)return;
  var i=b.rows.length;
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td class="tbl-cell" style="text-align:center;font-size:11px;color:var(--gray500);">'+(i+1)+'</td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.name||'')+'" placeholder="품명/규격 입력" oninput="calcG()"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.unit||'식')+'" style="text-align:center;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.qty||1)+'" min="0" oninput="calcG()" style="text-align:right;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.price||0)+'" min="0" oninput="calcG()" style="text-align:right;"></td>'+
    '<td class="tbl-ro" id="gs'+i+'">0</td>'+
    '<td class="tbl-ro" id="gv'+i+'">0</td>'+
    '<td class="tbl-ro" id="gt'+i+'" style="color:var(--primary);">0</td>'+
    '<td class="tbl-cell" ><input class="tbl-inp" type="text" value="'+(item.note||'')+'"></td>'+
    '<td class="tbl-cell" style="text-align:center;">'+
      '<button onclick="this.closest('tr').remove();renumberG();calcG();" style="background:var(--red);color:#fff;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:11px;">✕</button>'+
    '</td>';
  b.appendChild(tr); calcG();
}

function renumberG(){
  var rows=document.getElementById('g-items').rows;
  Array.from(rows).forEach(function(tr,i){
    tr.cells[0].textContent=i+1;
    tr.cells[5].id='gs'+i; tr.cells[6].id='gv'+i; tr.cells[7].id='gt'+i;
  });
}

function calcG(){
  var rows=document.getElementById('g-items'); if(!rows)return;
  var sub=0,vt=0,tot=0;
  Array.from(rows.rows).forEach(function(tr,i){
    var ins=tr.querySelectorAll('input');
    var qty=parseFloat(ins[2]?ins[2].value:0)||0;
    var price=parseFloat(ins[3]?ins[3].value:0)||0;
    var s=qty*price; var v=Math.round(s*0.1); var t=s+v;
    sub+=s;vt+=v;tot+=t;
    var se=document.getElementById('gs'+i);var ve=document.getElementById('gv'+i);var te=document.getElementById('gt'+i);
    if(se)se.textContent=nf(s); if(ve)ve.textContent=nf(v); if(te)te.textContent=nf(t);
  });
  st('g-sub',nf(sub)); st('g-vat',nf(vt)); st('g-total',nf(tot));
}

function addFromStdPrice(mode){
  var html='<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;" id="std-pop">'+
    '<div style="background:#fff;border-radius:10px;padding:20px;width:600px;max-height:80vh;overflow-y:auto;">'+
    '<div style="font-weight:700;font-size:14px;margin-bottom:12px;">표준단가에서 추가</div>'+

  stdPrices.forEach(function(p,i){
    html+='<tr><td>'+p.code+'</td><td style="font-weight:600;">'+p.name+'</td><td>'+p.spec+'</td><td>'+p.unit+'</td>'+

function selectStd(i,mode){
  var p=stdPrices[i];
  if(mode==='g') addGRow({name:p.name+' '+p.spec,unit:p.unit,qty:1,price:p.price});
  else addDRow('mat',{gong:'재료비',name:p.name,spec:p.spec,unit:p.unit,qty:1,price:p.price});
  document.getElementById('std-pop').remove();
}

  matItems.forEach(function(item){addDRow('mat',item);});

function addDRow(type,item){
  item=item||{};
  var b=document.getElementById('d-'+type); if(!b)return;
  var i=b.rows.length;
  var gongList=['재료비','인건비','장비비','외주비','경비','일반관리비'];
  var gOpts=gongList.map(function(g){return '<option'+(item.gong===g?' selected':'')+'>'+g+'</option>';}).join('');
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td class="tbl-cell" style="text-align:center;font-size:11px;color:var(--gray500);">'+(i+1)+'</td>'+
    '<td class="tbl-cell"><select class="tbl-inp" oninput="calcD()">'+gOpts+'</select></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.name||'')+'" placeholder="세부항목"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.spec||'')+'" placeholder="규격"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.unit||'식')+'" style="text-align:center;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.qty||1)+'" min="0" oninput="calcD()" style="text-align:right;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.price||0)+'" min="0" oninput="calcD()" style="text-align:right;"></td>'+
    '<td class="tbl-ro" id="d'+type+i+'">0</td>'+
    '<td class="tbl-cell" style="text-align:center;">'+
      '<button onclick="this.closest('tr').remove();calcD();" style="background:var(--red);color:#fff;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:11px;">✕</button>'+
    '</td>';
  b.appendChild(tr); calcD();
}

function calcD(){
  var calc=function(tbodyId){
    var b=document.getElementById(tbodyId); if(!b)return 0;
    var sub=0;
    Array.from(b.rows).forEach(function(tr,i){
      var ins=tr.querySelectorAll('input[type=number]');
      var qty=parseFloat(ins[0]?ins[0].value:0)||0;
      var price=parseFloat(ins[1]?ins[1].value:0)||0;
      var s=qty*price; sub+=s;
      var ae=document.getElementById('d'+tbodyId.replace('d-','')+i);
      if(ae)ae.textContent=nf(s);
    });
    return sub;
  };
  var mat=calc('d-mat'); var etc=calc('d-etc');
  st('d-mat-sub',nf(mat)); st('d-etc-sub',nf(etc));
  var rate=(parseFloat(v('d-mgmt-rate'))||10)/100;
  var mgmt=Math.round((mat+etc)*rate);
  var supply=mat+etc+mgmt;
  var vat=Math.round(supply*0.1);
  var total=supply+vat;
  sv('d-mgmt-amt',nf(mgmt)+'원');
  st('d-supply','₩'+nf(supply));
  st('d-vat','₩'+nf(vat));
  st('d-total','₩'+nf(total));
}

// ── 저장 ──
function saveQuote(type){
  var isG=type==='general';
  var q={type:type};
  var px=isG?'g':'d';
  q.no=v(px+'-no'); q.date=v(px+'-date'); q.valid=v(px+'-valid');
  q.manager=v(px+'-manager'); q.client=v(px+'-client');
  q.contact=v(px+'-contact'); q.title=v(px+'-title');
  q.tel=v(px+'-tel'); q.fax=v(px+'-fax');
  q.email=v(px+'-email'); q.addr=v(px+'-addr');
  q.delivery=v(px+'-delivery'); q.payment=v(px+'-payment');
  q.memo=v(px+'-memo');
  q.status=document.getElementById(px+'-status').value;

  if(isG){
    q.items=[];
    Array.from(document.getElementById('g-items').rows).forEach(function(tr){
      var ins=tr.querySelectorAll('input');
      q.items.push({name:ins[0]?ins[0].value:'',unit:ins[1]?ins[1].value:'',
        qty:parseFloat(ins[2]?ins[2].value:0)||0,price:parseFloat(ins[3]?ins[3].value:0)||0,note:ins[4]?ins[4].value:''});
    });
    q.supply=nv(document.getElementById('g-sub').textContent);
    q.vat=Math.round(q.supply*0.1); q.total=q.supply+q.vat;
  } else {
    q.matItems=[]; q.etcItems=[];
    ['d-mat','d-etc'].forEach(function(tbId){
      var key=tbId==='d-mat'?'matItems':'etcItems';
      Array.from(document.getElementById(tbId).rows).forEach(function(tr){
        var sels=tr.querySelectorAll('select'); var ins=tr.querySelectorAll('input');
        q[key].push({gong:sels[0]?sels[0].value:'',name:ins[0]?ins[0].value:'',
          spec:ins[1]?ins[1].value:'',unit:ins[2]?ins[2].value:'',
          qty:parseFloat(ins[3]?ins[3].value:0)||0,price:parseFloat(ins[4]?ins[4].value:0)||0});
      });
    });
    q.mgmtRate=parseFloat(v('d-mgmt-rate'))||10;
    q.supply=nv(document.getElementById('d-supply').textContent);
    q.vat=Math.round(q.supply*0.1); q.total=q.supply+q.vat;
  }

  var idx=quotes.findIndex(function(x){return x.no===q.no;});
  if(idx>=0)quotes[idx]=q; else quotes.push(q);
  setData('quotes',quotes);
  renderList();
  alert('✅ 저장완료: '+q.no);
}

// ── 목록 렌더 ──
function renderList(){
  var tb=document.getElementById('q-list-body'); if(!tb)return;
  var search=v('q-search').toLowerCase();
  var sf=v('q-status-f');
  var filtered=quotes.filter(function(q){
    return (!search||(q.no+q.client+q.title).toLowerCase().includes(search))&&(!sf||q.status===sf);
  });
  if(!filtered.length){tb.innerHTML='<tr><td colspan="11" style="text-align:center;color:var(--gray400);padding:20px;">견적서가 없습니다.</td></tr>';return;}
  tb.innerHTML='';
  filtered.forEach(function(q,i){
    var badge={수주:'bg',검토중:'bo',발송:'bb',미수주:'br'}[q.status]||'bgr';
    var typeLabel=q.type==='detail'?'<span class="badge bp">세부</span>':'<span class="badge bb">일반</span>';
    var realIdx=quotes.indexOf(q);
    tb.innerHTML+='<tr>'+
      '<td style="font-weight:600;">'+q.no+'</td><td>'+typeLabel+'</td><td>'+q.date+'</td>'+
      '<td>'+q.client+'</td><td>'+q.title+'</td>'+
      '<td style="text-align:right;">'+nf(q.supply)+'</td>'+
      '<td style="text-align:right;">'+nf(q.vat)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:var(--primary);">'+nf(q.total)+'</td>'+
      '<td>'+q.manager+'</td>'+
      '<td><span class="badge '+badge+'">'+q.status+'</span></td>'+
      '<td style="white-space:nowrap;">'+
        '<button class="btn btn-outline btn-xs" onclick="editQ('+realIdx+')" style="margin-right:3px;">수정</button>'+
        '<button class="btn btn-gray btn-xs" onclick="copyQ('+realIdx+')" style="margin-right:3px;">복사</button>'+
        '<button class="btn btn-danger btn-xs" onclick="delQ('+realIdx+')">삭제</button>'+
      '</td></tr>';
  });
}

function editQ(i){
  var q=quotes[i];
  if(q.type==='general'){
    switchTab(document.querySelectorAll('.tab-btn')[1],'q-general');
    initGeneral(i);
  } else {
    switchTab(document.querySelectorAll('.tab-btn')[2],'q-detail');
    initDetail(i);
  }
}
function copyQ(i){
  var q=JSON.parse(JSON.stringify(quotes[i]));
  q.no=nextNo(q.type); q.date=td();
  quotes.push(q); setData('quotes',quotes); renderList();
  alert('복사완료: '+q.no);
}
function delQ(i){
  if(!confirm('삭제하시겠습니까?'))return;
  quotes.splice(i,1); setData('quotes',quotes); renderList();
}

function excelQuote(type){
  if(typeof XLSX==='undefined'){alert('엑셀 라이브러리 로딩 중...');return;}
  var isG=type==='general'; var px=isG?'g':'d';
  var no=v(px+'-no'); var date=v(px+'-date');
  var client=v(px+'-client'); var contact=v(px+'-contact');
  var tel=v(px+'-tel'); var addr=v(px+'-addr');
  var title=v(px+'-title');
  var delivery=v(px+'-delivery'); var payment=v(px+'-payment'); var memo=v(px+'-memo');

  // 템플릿 바이너리 로드
  var bin=atob(QUOTE_TMPL_B64);
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  var wb=XLSX.read(arr,{type:'array',cellStyles:true,cellFormula:true});

  var ws1=wb.Sheets['일반견적서'];
  function S1(a,val){
    if(!ws1[a])ws1[a]={};
    ws1[a].v=val; ws1[a].t=typeof val==='number'?'n':'s';
    delete ws1[a].f;
  }

  // 수신처 정보
  S1('F9',client); S1('F10',contact); S1('F11',tel); S1('F12',addr);
  S1('C16',no); S1('F16',date);

  // 품목 수집
  var items=[];
  if(isG){
    Array.from(document.getElementById('g-items').rows).forEach(function(tr){
      var ins=tr.querySelectorAll('input');
      var name=ins[0]?ins[0].value:''; if(!name)return;
      items.push({name:name,unit:ins[1]?ins[1].value:'',
        qty:parseFloat(ins[2]?ins[2].value:0)||0,
        price:parseFloat(ins[3]?ins[3].value:0)||0});
    });
  }

  // 품목 입력 (22~27행)
  for(var i=0;i<6;i++){
    var r=22+i; var item=items[i]||{};
    S1('A'+r, i<items.length?i+1:'');
    S1('B'+r, '');
    S1('C'+r, item.name||'');
    S1('D'+r, '');
    S1('E'+r, item.unit||'');
    if(item.qty){ws1['F'+r]={v:item.qty,t:'n'};delete ws1['F'+r].f;}else S1('F'+r,'');
    if(item.price){ws1['G'+r]={v:item.price,t:'n'};delete ws1['G'+r].f;}else S1('G'+r,'');
    if(item.qty&&item.price){ws1['H'+r]={v:item.qty*item.price,t:'n'};delete ws1['H'+r].f;}else S1('H'+r,'');
  }

  // 특기사항
  if(delivery)ws1['A34']={v:'① 납기 : '+delivery,t:'s'};
  if(payment)ws1['A36']={v:'③ 결제조건 : '+payment,t:'s'};
  if(memo)ws1['A40']={v:'⑦ '+memo,t:'s'};

  // 세부내역 시트
  var ws2=wb.Sheets['세부내역견적서'];
  if(ws2){
    function S2(a,val){if(!ws2[a])ws2[a]={};ws2[a].v=val;ws2[a].t=typeof val==='number'?'n':'s';delete ws2[a].f;}
    S2('C16',no); S2('F16',date);
    var dItems=[];
    if(!isG){
      ['d-mat','d-etc'].forEach(function(tbId){
        var tb=document.getElementById(tbId); if(!tb)return;
        Array.from(tb.rows).forEach(function(tr){
          var sels=tr.querySelectorAll('select'); var ins=tr.querySelectorAll('input');
          var gong=sels[0]?sels[0].value:''; var name=ins[0]?ins[0].value:'';
          if(!gong&&!name)return;
          dItems.push({gong:gong,name:name,spec:ins[1]?ins[1].value:'',unit:ins[2]?ins[2].value:'',
            qty:parseFloat(ins[3]?ins[3].value:0)||0,price:parseFloat(ins[4]?ins[4].value:0)||0});
        });
      });
    }
    for(var i=0;i<10;i++){
      var r2=22+i; var di=dItems[i]||{};
      S2('A'+r2,i<dItems.length?i+1:''); S2('B'+r2,di.gong||'');
      S2('C'+r2,di.name||''); S2('D'+r2,di.spec||''); S2('E'+r2,di.unit||'');
      if(di.qty){ws2['F'+r2]={v:di.qty,t:'n'};delete ws2['F'+r2].f;}else S2('F'+r2,'');
      if(di.price){ws2['G'+r2]={v:di.price,t:'n'};delete ws2['G'+r2].f;}else S2('G'+r2,'');
      if(di.qty&&di.price){ws2['H'+r2]={v:di.qty*di.price,t:'n'};delete ws2['H'+r2].f;}else S2('H'+r2,'');
    }
  }

  XLSX.writeFile(wb,'견적서_'+no+'.xlsx',{bookType:'xlsx',type:'binary'});
}
