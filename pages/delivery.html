<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --white:#fff;--gray50:#f8f9fa;--gray100:#f1f3f5;--gray200:#e9ecef;
  --gray300:#dee2e6;--gray400:#ced4da;--gray500:#adb5bd;--gray600:#868e96;
  --gray700:#495057;--gray800:#343a40;--gray900:#212529;
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1d4ed8;
  --green:#16a34a;--green-light:#f0fdf4;--orange:#ea580c;--orange-light:#fff7ed;
  --red:#dc2626;--red-light:#fef2f2;--purple:#7c3aed;--teal:#0d9488;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray100);color:var(--gray800);font-size:13px;padding:16px;}
.card{background:#fff;border-radius:8px;border:1px solid var(--gray200);padding:16px;margin-bottom:12px;}
.card-title{font-size:13px;font-weight:700;color:var(--gray800);margin-bottom:12px;}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.tab-bar{display:flex;border-bottom:2px solid var(--gray200);margin-bottom:16px;}
.tab-btn{padding:8px 16px;font-size:12px;font-weight:600;color:var(--gray500);cursor:pointer;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;background:none;font-family:'Noto Sans KR',sans-serif;transition:all .12s;}
.tab-btn:hover{color:var(--primary);}
.tab-btn.on{color:var(--primary);border-bottom-color:var(--primary);}
.tab-content{display:none;}.tab-content.on{display:block;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .12s;}
.btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}.btn-outline:hover{background:var(--primary);color:#fff;}
.btn-gray{background:var(--gray100);color:var(--gray700);border:1px solid var(--gray300);}.btn-gray:hover{background:var(--gray200);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{background:#15803d;}
.btn-danger{background:var(--red);color:#fff;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-sm{padding:5px 10px;font-size:11px;}.btn-xs{padding:3px 8px;font-size:10px;}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.row-gap{display:flex;gap:8px;align-items:center;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.fg label{font-size:11px;font-weight:600;color:var(--gray600);}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--gray300);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .12s;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary);}
.fg input[readonly]{background:var(--gray50);color:var(--gray600);}
.fg textarea{min-height:60px;resize:vertical;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--gray50);border-bottom:1px solid var(--gray200);padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--gray500);white-space:nowrap;}
tbody td{border-bottom:1px solid var(--gray100);padding:8px 10px;color:var(--gray700);}
tbody tr:hover td{background:var(--gray50);}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.bg{background:#dcfce7;color:#166534;}.bb{background:#dbeafe;color:#1e40af;}
.bo{background:#fed7aa;color:#9a3412;}.br{background:#fee2e2;color:#991b1b;}
.bgr{background:var(--gray100);color:var(--gray600);}.bp{background:#ede9fe;color:#5b21b6;}
.hint{background:var(--gray50);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--gray600);margin-bottom:10px;border-left:3px solid var(--primary);}
.section-title{font-size:12px;font-weight:700;color:var(--gray700);margin:12px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--gray200);}
.search-bar{display:flex;gap:8px;align-items:center;}
.search-bar input,.search-bar select{border:1.5px solid var(--gray300);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.tbl-inp{border:none!important;outline:none;width:100%;padding:5px 6px;font-size:12px;font-family:'Noto Sans KR',sans-serif;background:transparent;}
.tbl-inp:focus{background:var(--primary-light);}
.tbl-cell{border:1px solid var(--gray200);padding:2px;}
.tbl-ro{border:1px solid var(--gray200);padding:6px;text-align:right;background:var(--gray50);font-weight:600;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--gray300);border-radius:4px;}
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn on" onclick="switchTab(this,'del-list')">📋 목록</button>
  <button class="tab-btn" onclick="switchTab(this,'del-write');initDel()">📝 거래명세서 작성</button>
</div>

<!-- 목록 -->
<div class="tab-content on" id="del-list">
  <div class="row-between">
    <div class="search-bar">
      <input type="month" id="del-month-f" onchange="renderDelList()">
      <input type="text" id="del-search" placeholder="명세서번호, 거래처 검색..." oninput="renderDelList()">
      <select id="del-status-f" onchange="renderDelList()">
        <option value="">전체</option><option>발행</option><option>발송완료</option><option>미발송</option>
      </select>
    </div>
    <button class="btn btn-primary btn-sm" onclick="switchTab(document.querySelectorAll('.tab-btn')[1],'del-write');initDel()">+ 거래명세서 작성</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
    <div class="card" style="border-left:3px solid var(--primary);margin-bottom:0;">
      <div style="font-size:11px;color:var(--gray500);">이번달 발행</div>
      <div style="font-size:20px;font-weight:800;" id="del-cnt">0건</div>
    </div>
    <div class="card" style="border-left:3px solid var(--green);margin-bottom:0;">
      <div style="font-size:11px;color:var(--gray500);">공급가액 합계</div>
      <div style="font-size:20px;font-weight:800;" id="del-supply-tot">₩0</div>
    </div>
    <div class="card" style="border-left:3px solid var(--orange);margin-bottom:0;">
      <div style="font-size:11px;color:var(--gray500);">VAT 합계</div>
      <div style="font-size:20px;font-weight:800;" id="del-vat-tot">₩0</div>
    </div>
    <div class="card" style="border-left:3px solid var(--teal);margin-bottom:0;">
      <div style="font-size:11px;color:var(--gray500);">합계금액</div>
      <div style="font-size:20px;font-weight:800;" id="del-total-tot">₩0</div>
    </div>
  </div>
  <div class="card">
    <table><thead><tr>
      <th>명세서번호</th><th>작성일</th><th>거래처</th><th>건명</th><th>납품장소</th>
      <th>공급가액</th><th>VAT</th><th>합계</th><th>담당자</th><th>상태</th><th>관리</th>
    </tr></thead>
    <tbody id="del-list-body"></tbody></table>
  </div>
</div>

<!-- 거래명세서 작성 -->
<div class="tab-content" id="del-write">
  <div class="card">
    <div class="card-title-row">
      <div style="font-size:14px;font-weight:700;">📦 거래명세서 작성</div>
      <div class="row-gap">
        <select id="del-status" style="border:1.5px solid var(--gray300);border-radius:6px;padding:6px 10px;font-size:12px;">
          <option>미발송</option><option>발행</option><option>발송완료</option>
        </select>
        <button class="btn btn-gray btn-sm" onclick="initDel()">🔄 초기화</button>
        <button class="btn btn-orange btn-sm" onclick="gmailDel()">✉️ Gmail발송</button>
        <button class="btn btn-green btn-sm" onclick="excelDel()">📥 엑셀저장</button>
        <button class="btn btn-outline btn-sm" onclick="printDel()">🖨️ 인쇄/PDF</button>
        <button class="btn btn-primary btn-sm" onclick="saveDel()">💾 저장</button>
      </div>
    </div>

    <!-- 헤더 정보 -->
    <div class="fr4">
      <div class="fg"><label>명세서번호</label><input type="text" id="del-no" readonly></div>
      <div class="fg"><label>작성일</label><input type="date" id="del-date"></div>
      <div class="fg"><label>담당자</label><input type="text" id="del-manager" value="박홍준"></div>
      <div class="fg"><label>결제조건</label><input type="text" id="del-payment" value="계약금 30%, 중도금 40%, 잔금 30%"></div>
    </div>
    <div class="fr3">
      <div class="fg"><label>거래처</label>
        <input type="text" id="del-client" placeholder="거래처명" list="del-client-list" oninput="fillDelClient()">
        <datalist id="del-client-list"></datalist>
      </div>
      <div class="fg"><label>담당자명</label><input type="text" id="del-contact" placeholder="거래처 담당자"></div>
      <div class="fg"><label>이메일</label><input type="text" id="del-email" placeholder="발송할 이메일"></div>
    </div>
    <div class="fr3">
      <div class="fg"><label>건명</label><input type="text" id="del-title" placeholder="공사/납품 건명"></div>
      <div class="fg"><label>납품장소</label><input type="text" id="del-place" placeholder="납품 장소"></div>
      <div class="fg"><label>연락처</label><input type="text" id="del-tel" placeholder="거래처 연락처"></div>
    </div>

    <!-- 품목 테이블 -->
    <div class="section-title">품목 내역</div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:12px;">
        <thead><tr style="background:var(--gray800);">
          <th style="color:#fff;padding:7px;width:36px;">No</th>
          <th style="color:#fff;padding:7px;min-width:220px;">품명/규격</th>
          <th style="color:#fff;padding:7px;width:55px;">단위</th>
          <th style="color:#fff;padding:7px;width:65px;">수량</th>
          <th style="color:#fff;padding:7px;width:110px;">단가</th>
          <th style="color:#fff;padding:7px;width:110px;">공급가액</th>
          <th style="color:#fff;padding:7px;width:90px;">VAT</th>
          <th style="color:#fff;padding:7px;width:110px;">합계</th>
          <th style="color:#fff;padding:7px;width:80px;">비고</th>
          <th style="color:#fff;padding:7px;width:28px;"></th>
        </tr></thead>
        <tbody id="del-items"></tbody>
        <tfoot>
          <tr style="background:var(--gray100);font-weight:700;">
            <td colspan="5" style="padding:8px;text-align:right;border:1px solid var(--gray200);">합 계</td>
            <td id="del-sub" style="padding:8px;text-align:right;border:1px solid var(--gray200);">0</td>
            <td id="del-vat" style="padding:8px;text-align:right;border:1px solid var(--gray200);">0</td>
            <td id="del-total" style="padding:8px;text-align:right;border:1px solid var(--gray200);color:var(--primary);font-size:13px;font-weight:800;">0</td>
            <td colspan="2" style="border:1px solid var(--gray200);"></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="row-gap" style="margin-top:8px;">
      <button class="btn btn-gray btn-sm" onclick="addDelRow()">+ 행 추가</button>
    </div>
    <div class="fg" style="margin-top:10px;"><label>비고/특이사항</label><textarea id="del-memo" placeholder="특이사항 입력..."></textarea></div>
  </div>
</div>

function nf(n){return Math.round(n||0).toLocaleString();}
function nv(s){return parseFloat((s+'').replace(/[^0-9.-]/g,''))||0;}
function td(){return new Date().toISOString().split('T')[0];}
function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function sv(id,val){var e=document.getElementById(id);if(e)e.value=val||'';}
function st(id,val){var e=document.getElementById(id);if(e)e.textContent=val||'';}
function switchTab(btn,cid){
  var bar=btn.closest('.tab-bar');
  bar.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('on');});
  var el=document.getElementById(cid);if(el)el.classList.add('on');
}
// 공유 데이터 (localStorage)
function getData(key){
  try{var d=localStorage.getItem('erp_'+key);return d?JSON.parse(d):null;}catch(e){return null;}
}
function setData(key,val){
  try{localStorage.setItem('erp_'+key,JSON.stringify(val));return true;}catch(e){return false;}
}
// Gmail 발송 (mailto 방식)
function sendGmail(to,subject,body){
  var mailto='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  window.open(mailto);
}
// 인쇄
function openPrint(html){
  var w=window.open('','_blank','width=1000,height=760');
  w.document.write(html);w.document.close();
}

<script>
var deliveries = getData('deliveries') || [];
var clients = getData('clients') || [
  {name:'한국환경(주)',contact:'김철수',tel:'031-XXX-XXXX',email:'kim@korenv.com',addr:'경기도 수원시'},
  {name:'대림산업',contact:'이부장',tel:'02-XXX-XXXX',email:'lee@daelim.com',addr:'서울시 종로구'},

];

function nextDelNo(){
  return 'DL-'+new Date().getFullYear()+'-'+String(deliveries.length+1).padStart(3,'0');
}

function initClientList(){
  var dl=document.getElementById('del-client-list'); if(!dl)return;
  dl.innerHTML='';
  clients.forEach(function(c){dl.innerHTML+='<option value="'+c.name+'">';});
}

function fillDelClient(){
  var name=v('del-client');
  var c=clients.find(function(x){return x.name===name;}); if(!c)return;
  sv('del-contact',c.contact||'');
  sv('del-tel',c.tel||'');
  sv('del-email',c.email||'');
}

function initDel(editIdx){
  var d=editIdx>=0?deliveries[editIdx]:null;

  sv('del-client', d?d.client:'');
  sv('del-contact', d?d.contact||'':'');
  sv('del-email', d?d.email||'':'');
  sv('del-title', d?d.title:'');
  sv('del-place', d?d.place||'':'');
  sv('del-tel', d?d.tel||'':'');
  sv('del-memo', d?d.memo||'':'');
  document.getElementById('del-status').value = d?d.status:'미발송';
  var b=document.getElementById('del-items'); b.innerHTML='';
  var items=d?d.items:[{name:'',unit:'식',qty:1,price:0,note:''}];
  items.forEach(function(item){addDelRow(item);});
  calcDel();
}

function addDelRow(item){
  item=item||{};
  var b=document.getElementById('del-items'); if(!b)return;
  var i=b.rows.length;
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td class="tbl-cell" style="text-align:center;font-size:11px;color:var(--gray500);">'+(i+1)+'</td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.name||'')+'" placeholder="품명/규격 입력" oninput="calcDel()"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.unit||'식')+'" style="text-align:center;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.qty||1)+'" min="0" oninput="calcDel()" style="text-align:right;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.price||0)+'" min="0" oninput="calcDel()" style="text-align:right;"></td>'+
    '<td class="tbl-ro" id="ds'+i+'">0</td>'+
    '<td class="tbl-ro" id="dv'+i+'">0</td>'+
    '<td class="tbl-ro" id="dt'+i+'" style="color:var(--primary);">0</td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.note||'')+'"></td>'+
    '<td class="tbl-cell" style="text-align:center;">'+
      '<button onclick="this.closest('tr').remove();renum();calcDel();" '+
      'style="background:var(--red);color:#fff;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:11px;">✕</button>'+
    '</td>';
  b.appendChild(tr); calcDel();
}

function renum(){
  Array.from(document.getElementById('del-items').rows).forEach(function(tr,i){
    tr.cells[0].textContent=i+1;
    tr.cells[5].id='ds'+i; tr.cells[6].id='dv'+i; tr.cells[7].id='dt'+i;
  });
}

function calcDel(){
  var rows=document.getElementById('del-items'); if(!rows)return;
  var sub=0,vt=0,tot=0;
  Array.from(rows.rows).forEach(function(tr,i){
    var ins=tr.querySelectorAll('input');
    var qty=parseFloat(ins[2]?ins[2].value:0)||0;
    var price=parseFloat(ins[3]?ins[3].value:0)||0;
    var s=qty*price; var vv=Math.round(s*0.1); var t=s+vv;
    sub+=s; vt+=vv; tot+=t;
    var se=document.getElementById('ds'+i);
    var ve=document.getElementById('dv'+i);
    var te=document.getElementById('dt'+i);
    if(se)se.textContent=nf(s);
    if(ve)ve.textContent=nf(vv);
    if(te)te.textContent=nf(t);
  });
  st('del-sub',nf(sub));
  st('del-vat',nf(vt));
  st('del-total',nf(tot));
}

function saveDel(){
  var d={
    no:v('del-no'), date:v('del-date'), manager:v('del-manager'),
    payment:v('del-payment'), client:v('del-client'), contact:v('del-contact'),
    email:v('del-email'), title:v('del-title'), place:v('del-place'),
    tel:v('del-tel'), memo:v('del-memo'),
    status:document.getElementById('del-status').value
  };
  if(!d.client){alert('거래처를 입력하세요.');return;}
  d.items=[];
  Array.from(document.getElementById('del-items').rows).forEach(function(tr){
    var ins=tr.querySelectorAll('input');
    d.items.push({
      name:ins[0]?ins[0].value:'', unit:ins[1]?ins[1].value:'식',
      qty:parseFloat(ins[2]?ins[2].value:0)||0,
      price:parseFloat(ins[3]?ins[3].value:0)||0,
      note:ins[4]?ins[4].value:''
    });
  });
  d.supply=nv(document.getElementById('del-sub').textContent);
  d.vat=Math.round(d.supply*0.1);
  d.total=d.supply+d.vat;
  var idx=deliveries.findIndex(function(x){return x.no===d.no;});
  if(idx>=0)deliveries[idx]=d; else deliveries.push(d);
  setData('deliveries',deliveries);
  renderDelList();
  alert('✅ 저장완료: '+d.no);
}

function renderDelList(){
  var tb=document.getElementById('del-list-body'); if(!tb)return;
  var month=v('del-month-f');
  var search=v('del-search').toLowerCase();
  var sf=v('del-status-f');
  var filtered=deliveries.filter(function(d){
    return (!month||d.date.startsWith(month))&&
           (!search||(d.no+d.client+d.title).toLowerCase().includes(search))&&
           (!sf||d.status===sf);
  });
  // 통계
  var supTot=0,vatTot=0,totTot=0;
  filtered.forEach(function(d){supTot+=d.supply||0;vatTot+=d.vat||0;totTot+=d.total||0;});
  st('del-cnt',filtered.length+'건');
  st('del-supply-tot','₩'+nf(supTot));
  st('del-vat-tot','₩'+nf(vatTot));
  st('del-total-tot','₩'+nf(totTot));
  if(!filtered.length){
    tb.innerHTML='<tr><td colspan="11" style="text-align:center;color:var(--gray400);padding:20px;">거래명세서가 없습니다.</td></tr>';
    return;
  }
  tb.innerHTML='';
  filtered.forEach(function(d){
    var badge={발행:'bg',발송완료:'bb',미발송:'bo'}[d.status]||'bgr';
    var ri=deliveries.indexOf(d);
    tb.innerHTML+='<tr>'+
      '<td style="font-weight:600;">'+d.no+'</td>'+
      '<td>'+d.date+'</td>'+
      '<td>'+d.client+'</td>'+
      '<td>'+d.title+'</td>'+
      '<td>'+d.place+'</td>'+
      '<td style="text-align:right;">'+nf(d.supply)+'</td>'+
      '<td style="text-align:right;">'+nf(d.vat)+'</td>'+
      '<td style="text-align:right;font-weight:700;color:var(--primary);">'+nf(d.total)+'</td>'+
      '<td>'+d.manager+'</td>'+
      '<td><span class="badge '+badge+'">'+d.status+'</span></td>'+
      '<td style="white-space:nowrap;">'+
        '<button class="btn btn-outline btn-xs" onclick="editDel('+ri+')" style="margin-right:3px;">수정</button>'+
        '<button class="btn btn-gray btn-xs" onclick="copyDel('+ri+')" style="margin-right:3px;">복사</button>'+
        '<button class="btn btn-danger btn-xs" onclick="delDel('+ri+')">삭제</button>'+
      '</td></tr>';
  });
}

function editDel(i){
  switchTab(document.querySelectorAll('.tab-btn')[1],'del-write');
  initDel(i);
}
function copyDel(i){
  var d=JSON.parse(JSON.stringify(deliveries[i]));
  d.no=nextDelNo(); d.date=td(); d.status='미발송';
  deliveries.push(d); setData('deliveries',deliveries); renderDelList();
  alert('복사완료: '+d.no);
}
function delDel(i){
  if(!confirm('삭제하시겠습니까?'))return;
  deliveries.splice(i,1); setData('deliveries',deliveries); renderDelList();
}

// 엑셀 저장
function excelDel(){
  if(typeof XLSX==='undefined'){alert('엑셀 라이브러리 로딩 중...');return;}
  var no=v('del-no'); var client=v('del-client'); var title=v('del-title');
  var wb=XLSX.utils.book_new();
  var ws=[];
  ws.push(['엔바이록스 주식회사 거래명세서']);
  ws.push(['명세서번호',no,'거래처',client,'건명',title]);
  ws.push(['작성일',v('del-date'),'납품장소',v('del-place'),'담당자',v('del-manager')]);
  ws.push([]);
  ws.push(['No','품명/규격','단위','수량','단가','공급가액','VAT','합계','비고']);
  Array.from(document.getElementById('del-items').rows).forEach(function(tr,i){
    var ins=tr.querySelectorAll('input');
    var name=ins[0]?ins[0].value:''; if(!name)return;
    var unit=ins[1]?ins[1].value:'';
    var qty=parseFloat(ins[2]?ins[2].value:0)||0;
    var price=parseFloat(ins[3]?ins[3].value:0)||0;
    var note=ins[4]?ins[4].value:'';
    ws.push([(i+1),name,unit,qty,price,qty*price,Math.round(qty*price*0.1),qty*price*1.1,note]);
  });
  ws.push([]);
  ws.push(['','','','','공급가액합계',nv(document.getElementById('del-sub').textContent)]);
  ws.push(['','','','','부가가치세',nv(document.getElementById('del-vat').textContent)]);
  ws.push(['','','','','최종합계',nv(document.getElementById('del-total').textContent)]);
  ws.push([]);
  ws.push(['결제조건',v('del-payment')]);
  var sheet=XLSX.utils.aoa_to_sheet(ws);
  sheet['!cols']=[{wch:5},{wch:28},{wch:8},{wch:8},{wch:12},{wch:14},{wch:12},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb,sheet,'거래명세서');
  XLSX.writeFile(wb,'거래명세서_'+no+'.xlsx');
}
