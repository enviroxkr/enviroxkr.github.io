<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --white:#fff;--gray50:#f8f9fa;--gray100:#f1f3f5;--gray200:#e9ecef;
  --gray300:#dee2e6;--gray400:#ced4da;--gray500:#adb5bd;--gray600:#868e96;
  --gray700:#495057;--gray800:#343a40;--gray900:#212529;
  --primary:#2563eb;--primary-light:#eff6ff;--primary-dark:#1d4ed8;
  --green:#16a34a;--green-light:#f0fdf4;--orange:#ea580c;--orange-light:#fff7ed;
  --red:#dc2626;--red-light:#fef2f2;--purple:#7c3aed;--teal:#0d9488;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--gray100);color:var(--gray800);font-size:13px;padding:16px;}
.card{background:#fff;border-radius:8px;border:1px solid var(--gray200);padding:16px;margin-bottom:12px;}
.card-title{font-size:13px;font-weight:700;color:var(--gray800);margin-bottom:12px;}
.card-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.tab-bar{display:flex;border-bottom:2px solid var(--gray200);margin-bottom:16px;}
.tab-btn{padding:8px 16px;font-size:12px;font-weight:600;color:var(--gray500);cursor:pointer;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;background:none;font-family:'Noto Sans KR',sans-serif;transition:all .12s;}
.tab-btn:hover{color:var(--primary);}
.tab-btn.on{color:var(--primary);border-bottom-color:var(--primary);}
.tab-content{display:none;}.tab-content.on{display:block;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans KR',sans-serif;transition:all .12s;}
.btn-primary{background:var(--primary);color:#fff;}.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}.btn-outline:hover{background:var(--primary);color:#fff;}
.btn-gray{background:var(--gray100);color:var(--gray700);border:1px solid var(--gray300);}.btn-gray:hover{background:var(--gray200);}
.btn-green{background:var(--green);color:#fff;}.btn-green:hover{background:#15803d;}
.btn-danger{background:var(--red);color:#fff;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-sm{padding:5px 10px;font-size:11px;}.btn-xs{padding:3px 8px;font-size:10px;}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
.row-gap{display:flex;gap:8px;align-items:center;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.fg label{font-size:11px;font-weight:600;color:var(--gray600);}
.fg input,.fg select,.fg textarea{border:1.5px solid var(--gray300);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .12s;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary);}
.fg input[readonly]{background:var(--gray50);color:var(--gray600);}
.fg textarea{min-height:60px;resize:vertical;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--gray50);border-bottom:1px solid var(--gray200);padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--gray500);white-space:nowrap;}
tbody td{border-bottom:1px solid var(--gray100);padding:8px 10px;color:var(--gray700);}
tbody tr:hover td{background:var(--gray50);}
tbody tr:last-child td{border-bottom:none;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
.bg{background:#dcfce7;color:#166534;}.bb{background:#dbeafe;color:#1e40af;}
.bo{background:#fed7aa;color:#9a3412;}.br{background:#fee2e2;color:#991b1b;}
.bgr{background:var(--gray100);color:var(--gray600);}.bp{background:#ede9fe;color:#5b21b6;}
.hint{background:var(--gray50);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--gray600);margin-bottom:10px;border-left:3px solid var(--primary);}
.section-title{font-size:12px;font-weight:700;color:var(--gray700);margin:12px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--gray200);}
.search-bar{display:flex;gap:8px;align-items:center;}
.search-bar input,.search-bar select{border:1.5px solid var(--gray300);border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.tbl-inp{border:none!important;outline:none;width:100%;padding:5px 6px;font-size:12px;font-family:'Noto Sans KR',sans-serif;background:transparent;}
.tbl-inp:focus{background:var(--primary-light);}
.tbl-cell{border:1px solid var(--gray200);padding:2px;}
.tbl-ro{border:1px solid var(--gray200);padding:6px;text-align:right;background:var(--gray50);font-weight:600;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--gray300);border-radius:4px;}
</style>
</head>
<body>
<div class="tab-bar">
  <button class="tab-btn on" onclick="switchTab(this,'po-list')">📋 발주서 목록</button>
  <button class="tab-btn" onclick="switchTab(this,'po-write');initPO()">📝 발주서 작성</button>
  <button class="tab-btn" onclick="switchTab(this,'vd-price')">🏭 업체단가</button>
</div>

<!-- 목록 -->
<div class="tab-content on" id="po-list">
  <div class="row-between">
    <div class="search-bar">
      <input type="text" id="po-search" placeholder="발주번호, 업체명 검색..." oninput="renderPOList()">
      <select id="po-status-f" onchange="renderPOList()">
        <option value="">전체</option><option>발주완료</option><option>배송중</option><option>입고완료</option>
      </select>
    </div>
    <button class="btn btn-primary btn-sm" onclick="switchTab(document.querySelectorAll('.tab-btn')[1],'po-write');initPO()">+ 발주서 작성</button>
  </div>
  <div class="card">
    <table><thead><tr>
      <th>발주번호</th><th>발주일</th><th>공급업체</th><th>납기요청일</th>
      <th>현장</th><th>발주금액</th><th>상태</th><th>관리</th>
    </tr></thead>
    <tbody id="po-list-body"></tbody></table>
  </div>
</div>

<!-- 발주서 작성 -->
<div class="tab-content" id="po-write">
  <div class="card">
    <div class="card-title-row">
      <div style="font-size:14px;font-weight:700;">📦 발주서 작성</div>
      <div class="row-gap">
        <select id="po-status" style="border:1.5px solid var(--gray300);border-radius:6px;padding:6px 10px;font-size:12px;">
          <option>발주완료</option><option>배송중</option><option>입고완료</option>
        </select>
        <button class="btn btn-gray btn-sm" onclick="initPO()">🔄 초기화</button>
        <button class="btn btn-orange btn-sm" onclick="gmailPO()">✉️ Gmail발송</button>
        <button class="btn btn-green btn-sm" onclick="excelPO()">📥 엑셀저장</button>
        <button class="btn btn-outline btn-sm" onclick="printPO()">🖨️ 인쇄/PDF</button>
        <button class="btn btn-primary btn-sm" onclick="savePO()">💾 저장</button>
      </div>
    </div>
    <div class="fr4">
      <div class="fg"><label>발주번호</label><input type="text" id="po-no" readonly></div>
      <div class="fg"><label>발주일</label><input type="date" id="po-date"></div>
      <div class="fg"><label>납기요청일</label><input type="date" id="po-due"></div>
      <div class="fg"><label>담당자</label><input type="text" id="po-manager" value="박홍준"></div>
    </div>
    <div class="fr3">
      <div class="fg"><label>공급업체</label>
        <input type="text" id="po-vendor" placeholder="업체명" list="vendor-list" oninput="fillVendorInfo()">
        <datalist id="vendor-list"></datalist>
      </div>
      <div class="fg"><label>업체 담당자</label><input type="text" id="po-vcontact"></div>
      <div class="fg"><label>업체 이메일</label><input type="text" id="po-vemail"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label>납품현장</label><input type="text" id="po-site" placeholder="시흥 RTO 설치 등"></div>
      <div class="fg"><label>업체 연락처</label><input type="text" id="po-vtel"></div>
    </div>

    <div class="section-title">발주 품목</div>
    <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;font-size:12px;">
      <thead><tr style="background:var(--gray800);">
        <th style="color:#fff;padding:7px;width:36px;">No</th>
        <th style="color:#fff;padding:7px;min-width:200px;">품명/규격</th>
        <th style="color:#fff;padding:7px;width:55px;">단위</th>
        <th style="color:#fff;padding:7px;width:65px;">수량</th>
        <th style="color:#fff;padding:7px;width:120px;">단가 <small style="font-weight:400;">(업체단가 자동반영)</small></th>
        <th style="color:#fff;padding:7px;width:110px;">공급가액</th>
        <th style="color:#fff;padding:7px;width:90px;">VAT</th>
        <th style="color:#fff;padding:7px;width:110px;">합계</th>
        <th style="color:#fff;padding:7px;width:80px;">비고</th>
        <th style="color:#fff;padding:7px;width:28px;"></th>
      </tr></thead>
      <tbody id="po-items"></tbody>
      <tfoot>
        <tr style="background:var(--gray100);font-weight:700;">
          <td colspan="5" style="padding:8px;text-align:right;border:1px solid var(--gray200);">합 계</td>
          <td id="po-sub" style="padding:8px;text-align:right;border:1px solid var(--gray200);">0</td>
          <td id="po-vat" style="padding:8px;text-align:right;border:1px solid var(--gray200);">0</td>
          <td id="po-total" style="padding:8px;text-align:right;border:1px solid var(--gray200);color:var(--primary);font-size:13px;">0</td>
          <td colspan="2" style="border:1px solid var(--gray200);"></td>
        </tr>
      </tfoot>
    </table>
    </div>
    <div class="row-gap" style="margin-top:8px;">
      <button class="btn btn-gray btn-sm" onclick="addPORow()">+ 행 추가</button>
      <button class="btn btn-gray btn-sm" onclick="addFromVendorPrice()">🏭 업체단가에서 추가</button>
    </div>
    <div class="fg" style="margin-top:10px;"><label>비고/특이사항</label><textarea id="po-memo"></textarea></div>
  </div>
</div>

<!-- 업체단가 -->
<div class="tab-content" id="vd-price">
  <div class="row-between">
    <div class="search-bar">
      <input type="text" id="vd-search" placeholder="품명 검색..." oninput="renderVdPrice()">
      <select id="vd-vendor-f" onchange="renderVdPrice()"><option value="">전체 업체</option></select>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openVdModal()">+ 단가 등록</button>
  </div>
  <div class="card">
    <table><thead><tr>
      <th>업체명</th><th>품명</th><th>규격</th><th>단위</th>
      <th>단가</th><th>최소발주량</th><th>납기</th><th>관리</th>
    </tr></thead>
    <tbody id="vd-list-body"></tbody></table>
  </div>
</div>

<!-- 업체단가 등록 모달 -->
<div id="vd-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:10px;padding:24px;width:500px;">
    <div style="font-size:14px;font-weight:700;margin-bottom:14px;">💲 업체단가 등록</div>
    <div class="fr2">
      <div class="fg"><label>업체명</label><input type="text" id="vd-m-vendor" list="vendor-list"></div>
      <div class="fg"><label>품명</label><input type="text" id="vd-m-name"></div>
    </div>
    <div class="fr2">
      <div class="fg"><label>규격</label><input type="text" id="vd-m-spec"></div>
      <div class="fg"><label>단위</label><select id="vd-m-unit"><option>EA</option><option>장</option><option>개</option><option>m</option><option>kg</option><option>식</option><option>DAY</option></select></div>
    </div>
    <div class="fr3">
      <div class="fg"><label>단가</label><input type="number" id="vd-m-price" value="0"></div>
      <div class="fg"><label>최소발주량</label><input type="number" id="vd-m-moq" value="1"></div>
      <div class="fg"><label>납기(일)</label><input type="number" id="vd-m-lead" value="3"></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
      <button class="btn btn-gray btn-sm" onclick="document.getElementById('vd-modal').style.display='none'">취소</button>
      <button class="btn btn-primary btn-sm" onclick="saveVdPrice()">저장</button>
    </div>
  </div>
</div>

function nf(n){return Math.round(n||0).toLocaleString();}
function nv(s){return parseFloat((s+'').replace(/[^0-9.-]/g,''))||0;}
function td(){return new Date().toISOString().split('T')[0];}
function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function sv(id,val){var e=document.getElementById(id);if(e)e.value=val||'';}
function st(id,val){var e=document.getElementById(id);if(e)e.textContent=val||'';}
function switchTab(btn,cid){
  var bar=btn.closest('.tab-bar');
  bar.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('on');});
  var el=document.getElementById(cid);if(el)el.classList.add('on');
}
// 공유 데이터 (localStorage)
function getData(key){
  try{var d=localStorage.getItem('erp_'+key);return d?JSON.parse(d):null;}catch(e){return null;}
}
function setData(key,val){
  try{localStorage.setItem('erp_'+key,JSON.stringify(val));return true;}catch(e){return false;}
}
// Gmail 발송 (mailto 방식)
function sendGmail(to,subject,body){
  var mailto='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  window.open(mailto);
}
// 인쇄
function openPrint(html){
  var w=window.open('','_blank','width=1000,height=760');
  w.document.write(html);w.document.close();
}

  var name=document.getElementById('po-vendor').value;
  var vd=vendors.find(function(x){return x.name===name;}); if(!vd)return;
  sv('po-vcontact',vd.contact); sv('po-vtel',vd.tel); sv('po-vemail',vd.email||'');
}

function nextPONo(){
  return 'PO-'+new Date().getFullYear()+'-'+String(poList.length+1).padStart(3,'0');
}

function initPO(editIdx){
  var q=editIdx>=0?poList[editIdx]:null;
  sv('po-no',q?q.no:nextPONo());
  sv('po-date',q?q.date:new Date().toISOString().split('T')[0]);
  var dd=new Date();dd.setDate(dd.getDate()+14);
  sv('po-due',q?q.due:dd.toISOString().split('T')[0]);
  sv('po-manager',q?q.manager:'박홍준');
  sv('po-vendor',q?q.vendor:''); sv('po-vcontact',q?q.vcontact||'':'');
  sv('po-vtel',q?q.vtel||'':''); sv('po-vemail',q?q.vemail||'':'');
  sv('po-site',q?q.site||'':''); sv('po-memo',q?q.memo||'':'');
  document.getElementById('po-status').value=q?q.status:'발주완료';
  var b=document.getElementById('po-items'); b.innerHTML='';
  var items=q?q.items:[{name:'',unit:'EA',qty:1,price:0,note:''}];
  items.forEach(function(item){addPORow(item);});
  calcPO();
}

function addPORow(item){
  item=item||{};
  var b=document.getElementById('po-items'); if(!b)return;
  var i=b.rows.length;
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td class="tbl-cell" style="text-align:center;font-size:11px;color:var(--gray500);">'+(i+1)+'</td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.name||'')+'" placeholder="품명/규격" oninput="calcPO()"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.unit||'EA')+'" style="text-align:center;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.qty||1)+'" min="0" oninput="calcPO()" style="text-align:right;"></td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="number" value="'+(item.price||0)+'" min="0" oninput="calcPO()" style="text-align:right;"></td>'+
    '<td class="tbl-ro" id="ps'+i+'">0</td>'+
    '<td class="tbl-ro" id="pv'+i+'">0</td>'+
    '<td class="tbl-ro" id="pt'+i+'" style="color:var(--primary);">0</td>'+
    '<td class="tbl-cell"><input class="tbl-inp" type="text" value="'+(item.note||'')+'"></td>'+
    '<td class="tbl-cell" style="text-align:center;">'+
      '<button onclick="this.closest('tr').remove();calcPO();" style="background:var(--red);color:#fff;border:none;border-radius:4px;width:22px;height:22px;cursor:pointer;font-size:11px;">✕</button>'+
    '</td>';
  b.appendChild(tr); calcPO();
}

function calcPO(){
  var rows=document.getElementById('po-items'); if(!rows)return;
  var sub=0,vt=0,tot=0;
  Array.from(rows.rows).forEach(function(tr,i){
    var ins=tr.querySelectorAll('input');
    var qty=parseFloat(ins[2]?ins[2].value:0)||0;
    var price=parseFloat(ins[3]?ins[3].value:0)||0;
    var s=qty*price; var vv=Math.round(s*0.1); var t=s+vv;
    sub+=s;vt+=vv;tot+=t;
    var se=document.getElementById('ps'+i);var ve=document.getElementById('pv'+i);var te=document.getElementById('pt'+i);
    if(se)se.textContent=nf(s); if(ve)ve.textContent=nf(vv); if(te)te.textContent=nf(t);
  });
  st('po-sub',nf(sub)); st('po-vat',nf(vt)); st('po-total',nf(tot));
}

function addFromVendorPrice(){
  var vendor=v('po-vendor');
  var filtered=vendor?vendorPrices.filter(function(p){return p.vendor===vendor;}):vendorPrices;
  var html='<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center;" id="vdp-pop">'+
    '<div style="background:#fff;border-radius:10px;padding:20px;width:680px;max-height:80vh;overflow-y:auto;">'+
    '<div style="font-weight:700;font-size:14px;margin-bottom:12px;">🏭 업체단가에서 품목 선택</div>'+
    '<table><thead><tr><th>업체</th><th>품명</th><th>규격</th><th>단위</th><th>단가</th><th>최소발주량</th><th></th></tr></thead><tbody>';
  filtered.forEach(function(p,i){
    html+='<tr><td>'+p.vendor+'</td><td style="font-weight:600;">'+p.name+'</td><td>'+p.spec+'</td><td>'+p.unit+'</td>'+
      '<td style="text-align:right;">'+nf(p.price)+'</td><td style="text-align:center;">'+p.moq+'</td>'+
      '<td><button class="btn btn-primary btn-xs" onclick="selectVdPrice(''+p.vendor+'',''+p.name+' '+p.spec+'',''+p.unit+'','+p.price+','+p.moq+')">추가</button></td></tr>';
  });
  html+='</tbody></table><div style="text-align:right;margin-top:12px;"><button class="btn btn-gray btn-sm" onclick="document.getElementById('vdp-pop').remove()">닫기</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}

function selectVdPrice(vendor,name,unit,price,moq){
  if(!v('po-vendor'))sv('po-vendor',vendor);
  addPORow({name:name,unit:unit,qty:moq,price:price});
  var pop=document.getElementById('vdp-pop'); if(pop)pop.remove();
}

function savePO(){
  var po={no:v('po-no'),date:v('po-date'),due:v('po-due'),manager:v('po-manager'),
    vendor:v('po-vendor'),vcontact:v('po-vcontact'),vtel:v('po-vtel'),vemail:v('po-vemail'),
    site:v('po-site'),memo:v('po-memo'),status:document.getElementById('po-status').value};
  po.items=[];
  Array.from(document.getElementById('po-items').rows).forEach(function(tr){
    var ins=tr.querySelectorAll('input');
    po.items.push({name:ins[0]?ins[0].value:'',unit:ins[1]?ins[1].value:'',
      qty:parseFloat(ins[2]?ins[2].value:0)||0,price:parseFloat(ins[3]?ins[3].value:0)||0,note:ins[4]?ins[4].value:''});
  });
  po.supply=nv(document.getElementById('po-sub').textContent);
  po.vat=Math.round(po.supply*0.1); po.total=po.supply+po.vat;
  var idx=poList.findIndex(function(x){return x.no===po.no;});
  if(idx>=0)poList[idx]=po; else poList.push(po);
  setData('poList',poList);
  renderPOList(); alert('✅ 저장완료: '+po.no);
}

function renderPOList(){
  var tb=document.getElementById('po-list-body'); if(!tb)return;
  var search=v('po-search').toLowerCase(); var sf=v('po-status-f');
  var filtered=poList.filter(function(p){
    return (!search||(p.no+p.vendor+p.site).toLowerCase().includes(search))&&(!sf||p.status===sf);
  });
  if(!filtered.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--gray400);padding:20px;">발주서가 없습니다.</td></tr>';return;}
  tb.innerHTML='';
  filtered.forEach(function(p){
    var badge={발주완료:'bb',배송중:'bo',입고완료:'bg'}[p.status]||'bgr';
    var ri=poList.indexOf(p);
    tb.innerHTML+='<tr><td style="font-weight:600;">'+p.no+'</td><td>'+p.date+'</td><td>'+p.vendor+'</td>'+
      '<td>'+p.due+'</td><td>'+p.site+'</td>'+
      '<td style="text-align:right;font-weight:700;">'+nf(p.total)+'</td>'+
      '<td><span class="badge '+badge+'">'+p.status+'</span></td>'+
      '<td><button class="btn btn-outline btn-xs" onclick="editPO('+ri+')" style="margin-right:3px;">수정</button>'+
      '<button class="btn btn-danger btn-xs" onclick="delPO('+ri+')">삭제</button></td></tr>';
  });
}

function editPO(i){
  switchTab(document.querySelectorAll('.tab-btn')[1],'po-write');
  initPO(i);
}
function delPO(i){if(!confirm('삭제?'))return;poList.splice(i,1);setData('poList',poList);renderPOList();}

function excelPO(){
  if(typeof XLSX==='undefined'){alert('로딩 중...');return;}
  var no=v('po-no'),date=v('po-date'),due=v('po-due');
  var vendor=v('po-vendor'),vcontact=v('po-vcontact'),vtel=v('po-vtel');
  var vemail=v('po-vemail'),site=v('po-site'),memo=v('po-memo');

  var bin=atob(PO_TMPL_B64);
  var arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  var wb=XLSX.read(arr,{type:'array',cellStyles:true});
  var ws=wb.Sheets['발주서'];

  function S(a,val){
    if(!ws[a])ws[a]={};
    ws[a].v=val; ws[a].t=typeof val==='number'?'n':'s';
    delete ws[a].f;
  }

  // 공급업체 정보
  S('F9',vendor); S('F10',vcontact); S('F11',vtel);
  S('F12',vemail); S('F13',site);
  S('F14',date); S('H14',due);
  S('C15',no);

  // 품목 수집
  var items=[];
  Array.from(document.getElementById('po-items').rows).forEach(function(tr){
    var ins=tr.querySelectorAll('input');
    var name=ins[0]?ins[0].value:''; if(!name)return;
    items.push({name:name,spec:'',unit:ins[1]?ins[1].value:'',
      qty:parseFloat(ins[2]?ins[2].value:0)||0,
      price:parseFloat(ins[3]?ins[3].value:0)||0});
  });

  // 품목 입력 (18~26행)
  var supTotal=0;
  for(var i=0;i<9;i++){
    var r=18+i; var item=items[i]||{};
    S('A'+r,i<items.length?i+1:'');
    S('C'+r,item.name||''); S('D'+r,item.spec||''); S('E'+r,item.unit||'');
    if(item.qty){ws['F'+r]={v:item.qty,t:'n'};delete ws['F'+r].f;}else S('F'+r,'');
    if(item.price){ws['G'+r]={v:item.price,t:'n'};delete ws['G'+r].f;}else S('G'+r,'');
    var s=(item.qty||0)*(item.price||0);
    if(s){ws['H'+r]={v:s,t:'n'};delete ws['H'+r].f;}else S('H'+r,'');
    supTotal+=s;
  }

  // 합계
  var vat=Math.round(supTotal*0.1);
  ws['H27']={v:supTotal,t:'n'}; delete ws['H27'].f;
  ws['H28']={v:vat,t:'n'}; delete ws['H28'].f;
  ws['H29']={v:supTotal+vat,t:'n'}; delete ws['H29'].f;
  ws['F16']={v:supTotal+vat,t:'n'}; delete ws['F16'].f;
  if(ws['F16']){ws['F16'].z='₩#,##0';}

  // 비고
  if(memo)S('A31',memo);

  XLSX.writeFile(wb,'발주서_'+no+'.xlsx',{bookType:'xlsx',type:'binary'});
}


function printPO(){

  var rows=''; var supply=0;

    var ins=tr.querySelectorAll('input');
    var name=ins[0]?ins[0].value:''; if(!name)return;
    var unit=ins[1]?ins[1].value:''; var qty=parseFloat(ins[2]?ins[2].value:0)||0;
    var price=parseFloat(ins[3]?ins[3].value:0)||0; var s=qty*price; supply+=s;
    rows+='<tr><td style="text-align:center;">'+(i+1)+'</td><td>'+name+'</td><td style="text-align:center;">'+unit+'</td>'+
      '<td style="text-align:right;">'+nf(qty)+'</td><td style="text-align:right;">'+nf(price)+'</td>'+
      '<td style="text-align:right;font-weight:700;">'+nf(s)+'</td></tr>';
  });
  var vat=Math.round(supply*0.1);
  var html='<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>발주서 '+no+'</title>'+
    '<style>@import url(https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap);'+
    '*{box-sizing:border-box;margin:0;padding:0;}body{font-family:"Noto Sans KR",sans-serif;font-size:10pt;padding:14mm;}'+
    '.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}'+
    '.logo{height:38px;}.title{font-size:22pt;font-weight:700;letter-spacing:8px;}.sub{font-size:8pt;color:#888;letter-spacing:4px;}'+
    'table{width:100%;border-collapse:collapse;}td,th{border:1px solid #bbb;padding:6px 8px;font-size:9pt;}'+
    '.lbl{background:#f0f0f0;font-weight:700;text-align:center;}thead tr{background:#444;}thead th{color:#fff;}'+
    '.tot{background:#333;color:#fff;font-weight:700;font-size:11pt;}.mid{background:#666;color:#fff;}'+
    '.sign{text-align:right;margin-top:24px;}@media print{.np{display:none;}}'+
    '</style></head><body>'+
    '<button class="np" onclick="window.print()" style="position:fixed;top:10px;right:10px;padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;">🖨️ 인쇄/PDF</button>'+
    '<div class="top"><img src="'+LOGO+'" class="logo"><div><div class="title">발  주  서</div><div class="sub">PURCHASE ORDER</div></div></div>'+
    '<table style="margin-bottom:10px;">'+
    '<tr><td class="lbl">발주번호</td><td style="font-weight:700;">'+no+'</td><td class="lbl">발주일</td><td>'+date+'</td></tr>'+
    '<tr><td class="lbl">공급업체</td><td style="font-weight:700;">'+vendor+'</td><td class="lbl">납기요청일</td><td style="font-weight:700;color:#dc2626;">'+due+'</td></tr>'+
    '<tr><td class="lbl">납품현장</td><td colspan="3">'+site+'</td></tr>'+
    '<tr><td class="lbl">발주자</td><td colspan="3">엔바이록스 주식회사 / 박홍준 / 010-3158-2132</td></tr>'+
    '</table>'+
    '<table><thead><tr><th>No</th><th>품명/규격</th><th>단위</th><th>수량</th><th>단가</th><th>금액</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<table style="margin-top:4px;"><tr class="mid"><td class="lbl">공급가액합계</td><td style="text-align:right;">₩'+nf(supply)+'</td></tr>'+
    '<tr class="mid"><td class="lbl">부가가치세(10%)</td><td style="text-align:right;">₩'+nf(vat)+'</td></tr>'+
    '<tr class="tot"><td>합 계 금 액</td><td style="text-align:right;">₩'+nf(supply+vat)+'</td></tr></table>'+
    '<p style="margin-top:16px;font-size:9pt;">상기와 같이 발주합니다. 납기 및 품질에 차질이 없도록 협조 부탁드립니다.</p>'+
    '<div class="sign"><strong>엔바이록스 주식회사&nbsp;&nbsp;대표이사&nbsp;&nbsp;박홍준&nbsp;&nbsp;(인)</strong></div>'+
    '</body></html>';
  openPrint(html);
}

function renderVdPrice(){
  var tb=document.getElementById('vd-list-body'); if(!tb)return;
  var search=v('vd-search').toLowerCase(); var vf=v('vd-vendor-f');
  var filtered=vendorPrices.filter(function(p){
    return (!search||(p.name+p.spec).toLowerCase().includes(search))&&(!vf||p.vendor===vf);
  });
  tb.innerHTML='';
  if(!filtered.length){tb.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--gray400);padding:20px;">단가 정보가 없습니다.</td></tr>';return;}
  filtered.forEach(function(p,i){
    tb.innerHTML+='<tr><td>'+p.vendor+'</td><td style="font-weight:600;">'+p.name+'</td><td>'+p.spec+'</td>'+
      '<td>'+p.unit+'</td><td style="text-align:right;font-weight:700;">'+nf(p.price)+'</td>'+
      '<td style="text-align:center;">'+p.moq+'</td><td style="text-align:center;">'+p.lead+'일</td>'+
      '<td><button class="btn btn-danger btn-xs" onclick="delVdPrice('+i+')">삭제</button></td></tr>';
  });
}

function openVdModal(){document.getElementById('vd-modal').style.display='flex';}
function saveVdPrice(){
  var p={vendor:v('vd-m-vendor'),name:v('vd-m-name'),spec:'',unit:v('vd-m-unit'),
    price:parseFloat(v('vd-m-price'))||0,moq:parseInt(v('vd-m-moq'))||1,lead:parseInt(v('vd-m-lead'))||3};
  if(!p.vendor||!p.name){alert('업체명과 품명 필수');return;}
  vendorPrices.push(p); setData('vendorPrices',vendorPrices);
  document.getElementById('vd-modal').style.display='none';
  renderVdPrice(); initVendorList(); alert('등록됨');
}
function delVdPrice(i){if(!confirm('삭제?'))return;vendorPrices.splice(i,1);setData('vendorPrices',vendorPrices);renderVdPrice();}

initVendorList(); renderPOList(); renderVdPrice(); initPO();
</script>
